<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CEFR-J 英単語帳</title>
  <link rel="stylesheet" href="app/style.css">
</head>
<body>

  <!-- ウェルカム画面 -->
  <div id="screen-welcome" class="screen active">
    <h1>CEFR-J 英単語帳</h1>
    <p class="subtitle">レベルを選択してください</p>

    <div id="level-selector">
      <button class="level-btn" data-level="A1">A1</button>
      <button class="level-btn" data-level="A2">A2</button>
      <button class="level-btn" data-level="B1">B1</button>
      <button class="level-btn" data-level="B2">B2</button>
      <button class="level-btn" data-level="C1">C1</button>
      <button class="level-btn" data-level="C2">C2</button>
    </div>

    <div id="mode-selector">
      <button class="mode-btn" data-mode="normal">英 → 日</button>
      <button class="mode-btn" data-mode="reverse">日 → 英</button>
    </div>

    <div id="mastery-section">
      <div id="mastery-header">
        <span class="section-label">習得判断</span>
        <div id="mastery-mode">
          <button class="mastery-btn" data-mastery="ratio">割合</button>
          <button class="mastery-btn" data-mastery="count">回数</button>
        </div>
      </div>
      <div id="mastery-input-ratio" class="mastery-input">
        <span>正解率</span>
        <input type="number" id="ratio-threshold" value="80" min="1" max="100">
        <span>% 以上で習得</span>
      </div>
      <div id="mastery-input-count" class="mastery-input" style="display:none">
        <span>正解</span>
        <input type="number" id="count-threshold" value="2" min="1" max="99">
        <span>回以上で習得</span>
      </div>
    </div>

    <div id="deck-size-section">
      <div class="mastery-input">
        <span class="section-label">出題数</span>
        <input type="number" id="deck-size-input" value="20" min="1">
        <span>問</span>
      </div>
    </div>

    <div id="animation-section">
      <label class="animation-label">
        <input type="checkbox" id="welcome-flip-anim" checked>
        カードの回転アニメーション
      </label>
      <label class="animation-label">
        <input type="checkbox" id="welcome-slide-anim" checked>
        カードのスライドアニメーション
      </label>
    </div>

    <div id="save-section">
      <p id="save-status"></p>
      <div id="save-section-btns">
        <button id="btn-clear-save" hidden>データをリセット</button>
        <button id="btn-toggle-text-io">テキスト ▾</button>
      </div>
      <div id="text-io-area" hidden>
        <button id="btn-export-text">コピー（エクスポート）</button>
        <textarea id="import-textarea" placeholder="テキストデータを貼り付け（インポート）..."></textarea>
        <p id="import-warning"></p>
        <button id="btn-import-text">読み込む</button>
      </div>
    </div>

    <button id="btn-start">スタート</button>

    <p id="license-note">
      単語データ：<a href="https://github.com/openlanguageprofiles/olp-en-cefrj" target="_blank" rel="noopener">CEFR-J Wordlist</a>（Tono Lab, CC BY-SA 4.0）／
      Octanove Vocabulary Profile（Octanove Labs, CC BY 4.0）／
      <a href="https://github.com/kujirahand/EJDict" target="_blank" rel="noopener">EJDict</a>（kujirahand, Public Domain）
    </p>
  </div>

  <!-- 学習画面 -->
  <div id="screen-study" class="screen">
    <div id="study-header">
      <span id="level-label">A1</span>
      <span id="progress-label">1 / 15</span>
      <div id="study-header-right">
        <button id="btn-settings">⚙</button>
        <button id="btn-interrupt">中断する</button>
      </div>
    </div>

    <div id="card-area">
      <div id="card-container">
        <div id="card-inner">
          <div id="card-front">
            <p id="word-text">apple</p>
            <p class="hint-text">タップして意味を確認</p>
          </div>
          <div id="card-back">
            <p id="meaning-text">リンゴ（果物）</p>
            <p id="pos-text">名詞</p>
            <div id="swipe-hint">
              <span class="hint-left">← 忘れた</span>
              <span class="hint-down">↓ SKIP</span>
              <span class="hint-right">覚えた →</span>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div id="overlay-forgotten"></div>
    <div id="overlay-remembered"></div>
    <div id="overlay-skip"></div>

    <!-- 設定モーダル -->
    <div id="settings-modal" hidden>
      <div id="settings-panel">
        <div id="settings-panel-header">
          <span>設定</span>
          <button id="btn-settings-close">✕</button>
        </div>
        <label class="animation-label">
          <input type="checkbox" id="flip-animation-checkbox" checked>
          カードの回転アニメーション
        </label>
        <label class="animation-label">
          <input type="checkbox" id="slide-animation-checkbox" checked>
          カードのスライドアニメーション
        </label>
      </div>
    </div>
  </div>

  <!-- 結果画面 -->
  <div id="screen-result" class="screen">
    <h2 id="result-title">完了！</h2>

    <div id="stats-card">
      <p id="stat-total"></p>
      <p id="stat-remembered"></p>
      <p id="stat-forgotten"></p>
      <p id="stat-accuracy"></p>
    </div>

    <div id="save-output-section">
      <p class="save-label">セーブデータを自動保存しました</p>
    </div>

    <div id="result-actions">
      <button id="btn-continue" class="btn-secondary">続きから再開</button>
      <button id="btn-restart" class="btn-secondary">タイトルへ戻る</button>
    </div>
  </div>

  <script src="data/words.js"></script>
  <script src="app/app.js"></script>
</body>
</html>
